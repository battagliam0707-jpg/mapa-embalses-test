<style>
    .dashboard-panel {
        position: fixed;
        top: 10px;
        right: 10px;
        width: 360px;
        max-height: 85vh;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        z-index: 9999;
        font-family: Arial, sans-serif;
        font-size: 11px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .dashboard-header {
        background: #1B4F72;
        color: white;
        padding: 8px 12px;
        font-weight: bold;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .dashboard-tabs {
        display: flex;
        background: #e0e0e0;
        border-bottom: 1px solid #ccc;
    }
    .tab-btn {
        flex: 1;
        padding: 6px;
        border: none;
        background: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 11px;
        color: #555;
    }
    .tab-btn.active {
        background: white;
        color: #1B4F72;
        border-bottom: 2px solid #1B4F72;
    }
    .dashboard-content {
        padding: 8px;
        overflow-y: auto;
        max-height: 65vh;
    }
    .widget-table {
        width: 100%;
        border-collapse: collapse;
    }
    .widget-table th, .widget-table td {
        border-bottom: 1px solid #ddd;
        padding: 5px 2px;
        text-align: left;
    }
    .widget-table th {
        background-color: #f2f2f2;
        position: sticky;
        top: 0;
    }
    .bar-container {
        margin-bottom: 7px;
    }
    .bar-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 2px;
        font-weight: bold;
    }
    .bar-bg {
        background: #e9ecef;
        border-radius: 4px;
        height: 10px;
        width: 100%;
        overflow: hidden;
    }
    .bar-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.3s;
    }
    .legend-box {
        padding: 6px;
        background: #f8f9fa;
        border-top: 1px solid #eee;
        font-size: 10px;
        display: flex;
        justify-content: space-around;
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }
</style>

    function switchTab(tabId, btn) {
        document.getElementById('tablaTab').style.display = tabId === 'tablaTab' ? 'block' : 'none';
        document.getElementById('rankingTab').style.display = tabId === 'rankingTab' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function toggleDashboard() {
        const tabEl = document.getElementById('dashTabs');
        const content1 = document.getElementById('tablaTab');
        const content2 = document.getElementById('rankingTab');
        const isHidden = tabEl.style.display === 'none';
        tabEl.style.display = isHidden ? 'flex' : 'none';
        content1.style.display = isHidden ? 'block' : 'none';
        content2.style.display = 'none';
    }

    function actualizarDashboard() {
        let mapObj = null;
        for (let key in window) {
            if (key.startsWith('map_') && window[key] instanceof L.Map) {
                mapObj = window[key];
                break;
            }
        }

        if (!mapObj) return;

        const bounds = mapObj.getBounds();
        const visibles = datosEmbalses.filter(d => bounds.contains([d.lat, d.lon]));

        const tbody = document.getElementById('tablaBody');
        tbody.innerHTML = '';
        if (visibles.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:8px;">Sin represas en pantalla</td></tr>';
        } else {
            visibles.forEach(d => {
                const row = `<tr>
                    <td><b>${d.nombre}</b></td>
                    <td>${d.pais.split('/')[0].trim()}</td>
                    <td>${d.capacidad_mw.toLocaleString()}</td>
                    <td><b style="color:${d.color_hex}">${d.volumen_pct}%</b></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        const rankingDiv = document.getElementById('rankingBars');
        rankingDiv.innerHTML = '';
        if (visibles.length === 0) {
            rankingDiv.innerHTML = '<div style="text-align:center; padding:12px; color:#666;">Sin represas en el área visible</div>';
        } else {
            const ordenados = [...visibles].sort((a, b) => b.volumen_pct - a.volumen_pct);
            ordenados.forEach(d => {
                const item = `
                <div class="bar-container">
                    <div class="bar-label">
                        <span>${d.nombre} (${d.pais.split('/')[0].trim()})</span>
                        <span style="color:${d.color_hex}">${d.volumen_pct}%</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width: ${d.volumen_pct}%; background-color: ${d.color_hex};"></div>
                    </div>
                </div>`;
                rankingDiv.innerHTML += item;
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(() => {
            let mapObj = null;
            for (let key in window) {
                if (key.startsWith('map_') && window[key] instanceof L.Map) {
                    mapObj = window[key];
                    break;
                }
            }

            if (mapObj) {
                mapObj.on('moveend zoomend', actualizarDashboard);
                actualizarDashboard();
            }
        }, 800);
    });
</script>

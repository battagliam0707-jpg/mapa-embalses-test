name: Actualización Diaria del Mapa de Embalses

on:
  schedule:
    - cron: '0 12 * * *'  # Se ejecuta automáticamente todos los días a las 12:00 UTC
  workflow_dispatch:      # Permite ejecución manual

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          pip install pandas folium requests beautifulsoup4

      - name: Ejecutar Scrapers y Generar HTML / GeoJSON
        run: |
          python generar_mapa.py

      - name: Commit y Push de los archivos actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html embalses.geojson
          git commit -m "Auto-update mapa y geojson [skip ci]" || exit 0
          git push

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4
